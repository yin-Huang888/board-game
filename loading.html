<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>加载中</title>
  <link rel="stylesheet" href="./loading.css">
</head>
<body>
  <main class="loading-screen" aria-live="polite" aria-label="正在加载局详情">
    <img src="./assets/loading-screen.png" alt="桌游拼车正在加载">
    <div class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
  <script>
    const query = location.search;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => { location.replace('./detail.html' + query); }, reduceMotion ? 300 : 1400);
  </script>
</body>
</html>
