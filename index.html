<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#350042">
  <meta name="description" content="桌游预约与拼桌交互原型">
  <title>Play Board Game</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b004a'/%3E%3Crect x='15' y='15' width='34' height='34' rx='7' fill='%23fffaf0'/%3E%3Ccircle cx='24' cy='24' r='3' fill='%233b004a'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%233b004a'/%3E%3Ccircle cx='40' cy='40' r='3' fill='%233b004a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <main class="phone-page" id="app" aria-label="Play Board Game 桌游预约首页">
    <img class="home-art" src="./assets/homepage-reference.jpg" alt="Play Board Game 桌游预约首页">
    <section class="search-wrap" aria-label="搜索桌游">
      <label class="search-box" for="searchInput">
        <input id="searchInput" type="search" autocomplete="off" inputmode="search" enterkeyhint="search" placeholder="搜索桌游 寻找搭子一起开局" aria-label="输入桌游名称">
        <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索">×</button>
        <button class="search-btn" id="searchBtn" type="button" aria-label="搜索桌游"><span class="sr-only">搜索</span></button>
      </label>
      <div class="search-panel" id="searchPanel" aria-live="polite"></div>
    </section>
    <section class="hotspots" aria-label="约局快捷入口">
      <button type="button" data-flow="nearby" aria-label="拼车广场"></button>
      <button type="button" data-flow="type" aria-label="桌游类型"></button>
      <button type="button" data-flow="create" aria-label="发起拼桌"></button>
    </section>
    <button class="detail-hotspot" id="detailBtn" type="button" aria-label="查看我的约局"></button>
  </main>
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <div><p id="sheetKicker">快速开始</p><h2 id="sheetTitle">选择约局</h2></div>
      <button class="close-sheet" id="closeSheet" type="button" aria-label="关闭">×</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=5"></script>
</body>
</html>
