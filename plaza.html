<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a0049">
  <title>拼车广场</title>
  <link rel="stylesheet" href="./plaza.css?v=2">
</head>
<body>
  <main class="plaza-page">
    <button class="title-pill" id="backBtn" type="button" aria-label="返回首页">拼车广场</button>

    <section class="calendar-bar" aria-label="选择星期">
      <div class="calendar-icon" aria-hidden="true"><b>▣</b><i>⚄</i></div>
      <nav class="week-tabs">
        <button class="active" type="button" data-day="1">一</button>
        <button type="button" data-day="2">二</button>
        <button type="button" data-day="3">三</button>
        <button type="button" data-day="4">四</button>
        <button type="button" data-day="5">五</button>
        <button type="button" data-day="6">六</button>
        <button type="button" data-day="0">日</button>
      </nav>
    </section>

    <section id="groupOne" class="date-group">
      <header class="date-row"><span id="dateOne">9.28</span><strong id="countOne">2 场</strong></header>
      <div class="cards" id="openCards"></div>
    </section>

    <section id="groupTwo" class="date-group secondary-group">
      <header class="date-row"><span id="dateTwo">9.28</span><strong id="countTwo">1 场</strong></header>
      <div class="cards" id="closedCards"></div>
    </section>

    <button class="create-button" id="createBtn" type="button" onclick="location.href='./create.html'">发起拼车</button>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./store.js?v=7"></script>
  <script src="./catalog.js?v=1"></script>
  <script src="./plaza.js?v=6"></script>
</body>
</html>
