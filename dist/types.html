<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3a0049">
  <title>桌游类型</title>
  <link rel="stylesheet" href="./types.css?v=2">
  <link rel="stylesheet" href="./catalog-ui.css?v=2">
</head>
<body>
  <main class="types-page catalog-page">
    <button class="page-title" id="backHome" type="button">← 返回首页</button>
    <div class="catalog-intro"><strong>桌游类型</strong><span>先选玩法，再找心仪的游戏</span></div>
    <label class="type-search"><span>⌕</span><input id="typeSearch" type="search" placeholder="搜索游戏名称或英文名" autocomplete="off"></label>
    <nav class="filters" id="filters" aria-label="桌游分类"></nav>
    <p class="result-count" id="typeCount" aria-live="polite"></p>
    <section class="game-grid" id="gameGrid" aria-live="polite"></section>
    <p class="empty" id="emptyMessage" hidden>这个分类还没有桌游</p>
  </main>
  <script src="./catalog.js?v=1"></script>
  <script src="./types.js?v=3"></script>
</body>
</html>
