<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3a0049">
  <title>我的约局</title>
  <link rel="stylesheet" href="./rides.css?v=10">
</head>
<body>
  <main class="rides-page">
    <button class="back" type="button" onclick="location.href='./index.html'" aria-label="返回首页">←</button>
    <section class="profile">
      <button class="panda" id="profileAvatar" type="button" aria-label="更换头像"><span id="avatarFallback">🐼</span><img id="avatarImage" alt="我的头像" hidden></button>
      <div class="profile-info"><h1 id="profileName">用户昵称</h1><p>我的信誉分：<strong id="creditScore">100</strong></p><button class="edit-profile" id="editProfile" type="button">编辑资料 ✎</button></div>
    </section>
    <p class="credit-note">准时参加保持 100 分；开局前 2 小时内退出扣 10 分。</p>
    <section class="ride-section"><h2>我发起的</h2><div class="rule"></div><div class="ride-list" id="initiatedList"></div></section>
    <section class="ride-section"><h2>我参与的</h2><div class="rule"></div><div class="ride-list" id="joinedList"></div></section>
  </main>
  <input id="avatarFile" class="visually-hidden" type="file" accept="image/*" aria-label="选择头像图片">
  <div class="profile-backdrop" id="profileBackdrop" hidden></div>
  <section class="profile-dialog" id="profileDialog" role="dialog" aria-modal="true" aria-labelledby="profileDialogTitle" hidden>
    <h2 id="profileDialogTitle">编辑个人资料</h2>
    <button class="dialog-avatar" id="dialogAvatar" type="button" aria-label="从相册选择头像"><span id="dialogAvatarFallback">🐼</span><img id="dialogAvatarImage" alt="头像预览" hidden><small>点击更换头像</small></button>
    <button class="reset-avatar" id="resetAvatar" type="button">恢复默认头像</button>
    <label for="nicknameInput">昵称</label>
    <input id="nicknameInput" type="text" maxlength="16" autocomplete="nickname" placeholder="输入你的昵称">
    <p class="profile-note">点击头像可从相册选择照片；信誉分由约局记录决定。</p>
    <div class="profile-actions"><button id="cancelProfile" type="button">取消</button><button id="saveProfile" type="button">保存资料</button></div>
  </section>
  <div class="contact-backdrop" id="contactBackdrop" hidden></div>
  <section class="contact-dialog" id="contactDialog" role="dialog" aria-modal="true" aria-labelledby="contactTitle" hidden>
    <button class="contact-close" id="closeContact" type="button" aria-label="关闭">×</button>
    <div class="contact-avatar" aria-hidden="true">🐼</div>
    <h2 id="contactTitle">联系局主</h2>
    <p id="contactRideName"></p>
    <div class="contact-id"><span>局主微信号</span><strong id="contactWechat"></strong></div>
    <p class="contact-note" id="contactNote"></p>
    <button class="copy-contact" id="copyContact" type="button">复制微信号</button>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./store.js?v=7"></script>
  <script src="./catalog.js?v=1"></script>
  <script src="./rides.js?v=11"></script>
</body>
</html>
