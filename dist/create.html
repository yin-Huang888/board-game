<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a0049">
  <title>发起拼车</title>
  <link rel="stylesheet" href="./create.css?v=7">
</head>
<body>
  <main class="create-page">
    <section class="top-panel">
      <button class="page-title" type="button" onclick="location.href='./plaza.html'">发起拼车</button>

      <section class="schedule-card">
        <h1>开车时间</h1>
        <div class="date-field"><strong>日期：</strong><button id="dateField" data-picker="date" type="button">2026.9.28</button></div>
        <div class="time-row">
          <strong>开始时间：</strong><button id="startField" data-picker="start" type="button">13:00</button>
          <strong>结束时间：</strong><button id="endField" data-picker="end" type="button">16:00</button>
        </div>
      </section>

      <section class="location-card">
        <div class="map-mark" aria-hidden="true"><span>⌖</span><i>⚄</i></div>
        <div class="location-choice"><label for="locationField">活动地点</label><select id="locationField"><option value="K5栋综合楼桌游室">K5栋综合楼桌游室（默认）</option><option value="学校图书馆活动室">学校图书馆活动室</option><option value="社区活动中心">社区活动中心</option><option value="custom">自定义地点…</option></select><input id="customLocation" type="text" maxlength="60" placeholder="输入具体地点" hidden></div>
        <span class="available"><i></i> 可预约</span>
      </section>
    </section>

    <h2 class="section-label">队伍编辑</h2>

    <section class="team-panel">
      <div class="team-card">
        <button class="game-picker" id="gamePicker" type="button" aria-label="选择桌游">
          <span id="gamePlaceholder">＋</span>
          <div class="picked-cover" id="pickedCover" hidden><img src="./assets/plaza-screen.jpg" alt="已选择桌游"></div>
        </button>

        <div class="team-fields">
          <p>车队名称：<strong id="teamName">队伍名字</strong></p>
          <p>可招募人数：</p>
          <div class="people-control">
            <div class="people-icon" aria-hidden="true">♟♟♟</div>
            <div class="count-stack">
              <button data-picker="min" id="minField" type="button">最少5人</button>
              <i></i>
              <button data-picker="max" id="maxField" type="button">最多8人</button>
            </div>
          </div>
        </div>

        <textarea id="introField" placeholder="队伍简介…"></textarea>
        <div class="intro-icon" aria-hidden="true"><span>⚑</span><b>🚕</b></div>
        <label class="wechat-field" for="wechatField">局主微信号 <small>加入后可查看并复制；示例号请改成你自己的</small><input id="wechatField" type="text" maxlength="40" value="panda_boardgame" autocomplete="off"></label>
      </div>
    </section>

    <button class="start-button" id="startRideBtn" type="button">开车</button>
  </main>

  <div class="picker-backdrop" id="pickerBackdrop" hidden></div>
  <section class="picker-sheet" id="pickerSheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle" hidden>
    <header class="picker-head">
      <button id="cancelPicker" type="button">取消</button>
      <h2 id="pickerTitle">选择时间</h2>
      <button id="confirmPicker" type="button">确定</button>
    </header>
    <div class="wheel-area" id="wheelArea"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <script src="./store.js?v=7"></script>
  <script src="./catalog.js?v=1"></script>
  <script src="./create.js?v=7"></script>
</body>
</html>
