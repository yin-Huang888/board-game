<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3a0049">
  <title>桌游详情</title>
  <link rel="stylesheet" href="./game.css?v=2">
</head>
<body>
  <main class="game-page">
    <button class="type-title" id="backBtn" type="button">桌游类型</button>

    <section class="game-overview">
      <div class="cover-card">
        <div class="game-cover" id="gameCover"><img id="coverImage" src="./assets/plaza-screen.jpg" alt="桌游封面"></div>
        <h1 id="gameName">险恶迷航</h1>
      </div>
      <div class="facts-card">
        <p><b>难度：</b><span class="stars" id="stars">★★★</span></p>
        <p><b>类型：</b><span id="gameType"></span></p>
        <p><b>人数：</b><span id="playerRange"></span></p>
        <p><b>时长：</b><span id="duration"></span></p>
      </div>
      <div class="intro-card">
        <strong>简<br>介</strong>
        <p id="gameIntro"></p>
      </div>
    </section>

    <h2 class="rides-title">近期发车</h2>
    <section class="ride-list" id="rideList"></section>
    <a class="create-ride" id="createRide" href="./create.html">发起拼车</a>
  </main>
  <script src="./store.js?v=7"></script>
  <script src="./catalog.js?v=1"></script>
  <script src="./game.js?v=7"></script>
</body>
</html>
